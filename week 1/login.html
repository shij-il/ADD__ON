<!DOCTYPE html5>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to bottom right, #dbe3ff, #f7f9ff);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #3f51b5;
            color: white;
            padding: 18px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            margin-top: 8px;
        }

        nav a {
            text-decoration: none;
            color: white;
            margin: 0 18px;
            font-size: 18px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
        }

        nav a:hover {
            background: rgba(255,255,255,0.2);
        }

        .active {
            text-decoration: underline;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
        }

        .login-box {
            background: white;
            padding: 40px;
            width: 420px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.15);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 26px;
        }

        .login-box label {
            font-weight: bold;
            display: block;
            margin: 12px 0 6px;
            font-size: 15px;
        }

        .login-box input,
        .login-box select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #bbb;
            font-size: 16px;
            box-sizing: border-box;
        }

        .phone-group {
            display: flex;
            gap: 10px;
        }

        .phone-group select {
            width: 38%;
        }

        .phone-group input {
            width: 62%;
        }

        .login-box button {
            width: 100%;
            background: #3f51b5;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            margin-top: 25px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }

        .login-box button:hover {
            background: #2c3a94;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<header>
    <h1>My Website Login</h1>
    <nav>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="enq.html">Enquiry</a>
        <a href="login.html" class="active">Login</a>
    </nav>
</header>

<div class="container">
    <div class="login-box">
        <h2>Login</h2>

        <form onsubmit="saveProfileData(event)">

            <label>Username</label>
            <input id="username" type="text" placeholder="Enter Username" required
                   pattern="[A-Za-z0-9]{4,}"
                   title="Username must contain only letters and numbers, minimum 4 characters.">

            <label>Password</label>
            <input id="password" type="password" placeholder="Enter Password" required
                   pattern="(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
                   title="Password must be at least 8 characters long, include 1 uppercase letter, 1 number, and 1 special character.">

            <label>Phone Number</label>
            <div class="phone-group">
                <select id="countryCode" required>
                    <option value="+91">🇮🇳 +91</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+971">🇦🇪 +971</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+81">🇯🇵 +81</option>
                </select>

                <input id="phone" type="text" placeholder="10-digit number" required
                       pattern="\d{10}" maxlength="10"
                       title="Enter exactly 10 digits.">
            </div>

            <label>Upload Photo</label>
            <input id="photo" type="file" accept="image/*" required>

            <button type="submit">Login</button>
        </form>

    </div>
</div>
<script>
function saveProfileData(event) {
    event.preventDefault();

    let username = document.getElementById("username").value;
    let phone = document.getElementById("phone").value;
    let code = document.getElementById("countryCode").value;
    let file = document.getElementById("photo").files[0];

    let fullPhone = code + " " + phone;
    let reader = new FileReader();
    reader.onload = function(e) {
        localStorage.setItem("profileImage", e.target.result);
        localStorage.setItem("username", username);
        localStorage.setItem("phone", fullPhone);

        window.location.href = "about.html";
    };
    reader.readAsDataURL(file);
}
</script>
</body>
</html>
