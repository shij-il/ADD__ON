<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="topbar">
        <nav>
            <div class="nav-left">
                <a href="#">About</a>
                <a href="#">Store</a>
            </div>
            <div class="nav-right">
                <a href="#">Gmail</a>
                <a href="#">Images</a>
                <button class="icon">🔔</button>
                <button class="signin">Sign in</button>
            </div>
        </nav>
    </header>

    <main class="main">
        <div class="logo">
            <span class="g g1">G</span>
            <span class="g g2">o</span>
            <span class="g g3">o</span>
            <span class="g g4">g</span>
            <span class="g g5">l</span>
            <span class="g g6">e</span>
        </div>

        <div class="search-box">
            <span class="icon-left">🔍</span>
            <input type="text" placeholder="Search Google or type a URL">
            <span class="icon-right">🎤</span>
        </div>

        <div class="btn-group">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>

        <p class="languages">
            Google offered in:
            <a href="#">हिन्दी</a>
            <a href="#">বাংলা</a>
            <a href="#">తెలుగు</a>
            <a href="#">मराठी</a>
        </p>
    </main>

    <footer class="footer">
        <div class="footer-left">
            <a href="#">Advertising</a>
            <a href="#">Business</a>
            <a href="#">How Search Works</a>
        </div>

        <div class="footer-right">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Settings</a>
        </div>
    </footer>
</body>
</html>
