<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <style>
        body {
            margin: 0;
            background: #eef2ff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #3f51b5;
            color: white;
            padding: 15px 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        nav a {
            text-decoration: none;
            color: white;
            margin: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .profile-card {
            width: 350px;
            background: white;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }

        .profile-card img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #3f51b5;
            object-fit: cover;
        }

        .profile-card h2 {
            margin-top: 15px;
            font-size: 24px;
            color: #333;
        }

        .profile-card p {
            font-size: 18px;
            margin: 8px 0;
            color: #444;
        }
    </style>
</head>

<body>

<header>
    <h1>My Profile</h1>
    <nav>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<div class="profile-card">
    <img id="profileImg" src="" alt="Profile Picture">
    <h2 id="profileName"></h2>
    <p id="profilePhone"></p>
</div>

<script>
    document.getElementById("profileImg").src = localStorage.getItem("profileImage");
    document.getElementById("profileName").innerText = "Username: " + localStorage.getItem("username");
    document.getElementById("profilePhone").innerText = "Phone: " + localStorage.getItem("phone");
</script>

</body>
</html>
